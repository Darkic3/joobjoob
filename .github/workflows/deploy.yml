name: Deploy Shop to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, mysql, zip, curl, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }} # حالا فقط h422450 است
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21 # پورت 21 برای FTPS Explicit در سی‌پنل استاندارد است
          protocol: ftps # <--- این خط را از ftp به ftps تغییر دادیم
          server-dir: ${{ secrets.FTP_DESTINATION }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.example
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/tests/**
