name: Deploy Shop to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, mysql, zip, curl, bcmath
          tools: composer

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;

            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_HOST:21;

            mirror -R \
              --verbose \
              --parallel=2 \
              --exclude-glob .git/ \
              --exclude-glob node_modules/ \
              --exclude-glob .env \
              --exclude-glob 'storage/logs/*' \
              --exclude-glob 'storage/framework/cache/*' \
              --exclude-glob 'storage/framework/sessions/*' \
              --exclude-glob 'storage/framework/views/*' \
              ./ /public_html/shop/;

            bye
          "
